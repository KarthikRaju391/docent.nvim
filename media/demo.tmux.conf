# tmux config for the launch demo recording: no chrome, just two panes.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g status off
set -g pane-border-status off
set -g pane-border-lines simple
set -g pane-border-style "fg=#3a4250"
set -g pane-active-border-style "fg=#3a4250"
set -g mouse off
set -g escape-time 0
set -g history-limit 2000
